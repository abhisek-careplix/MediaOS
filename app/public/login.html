<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Sign in · CarePlix Studio</title>
<link rel="icon" href="/img/careplix-mark.png">
<link rel="apple-touch-icon" href="/img/careplix-mark.png">
<link rel="stylesheet" href="/css/studio.css">
<style>
  body { overflow: hidden; }
  .wall { position: fixed; inset: -10vh -5vw; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; transform: rotate(-8deg) scale(1.15); opacity: .55; }
  .col { display: grid; gap: 14px; align-content: start; animation: drift 90s linear infinite; }
  .col:nth-child(2n) { animation-duration: 120s; animation-direction: reverse; }
  .col img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
  @keyframes drift { to { transform: translateY(-50%); } }
  .veil { position: fixed; inset: 0; background: radial-gradient(60% 70% at 50% 50%, rgba(10, 10, 12, .55), rgba(10, 10, 12, .94) 70%); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; }
  .card { width: min(420px, 100%); padding: 44px 36px 28px; border-radius: 28px; background: rgba(255, 255, 255, .97); color: #1d1d1f; border: 1px solid rgba(255, 255, 255, .7); box-shadow: 0 40px 120px rgba(0, 0, 0, .6); text-align: center; display: grid; gap: 18px; animation: rise .8s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
  h1 { margin: 0; display: grid; justify-items: center; gap: 10px; }
  h1 img { height: 42px; width: auto; display: block; }
  h1 span { font-size: 12.5px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: #6e6e73; padding-left: .34em; }
  .lead { margin: -2px 0 8px; color: #6e6e73; font-size: 15px; line-height: 1.45; }
  /* "Sign in with CarePlix", shaped like the familiar sign-in buttons; it starts the Google sign-in for CarePlix accounts */
  .signin { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 980px; background: #fff; color: #1f1f1f; border: 1px solid #dadce0; font: 500 15.5px/1 -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif; text-decoration: none; transition: transform .2s cubic-bezier(.34, 1.4, .64, 1), box-shadow .2s, background .2s; }
  .signin:hover { background: #f8f9fb; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(16, 24, 40, .14); }
  .signin:active { transform: scale(.98); }
  .signin:focus-visible { outline: 3px solid rgba(47, 151, 240, .45); outline-offset: 2px; }
  .signin img { height: 19px; width: auto; display: block; margin-top: 1px; }
  .who { color: #86868b; font-size: 12.5px; line-height: 1.5; }
  .who b { color: #3a3a3c; font-weight: 600; }
  .msg { border-radius: 14px; padding: 11px 14px; font-size: 13px; text-align: left; display: flex; gap: 10px; align-items: flex-start; }
  .msg.err { background: #fff1f0; color: #b42318; border: 1px solid #fecdca; }
  .msg.ok { background: #ecfdf3; color: #067647; border: 1px solid #abefc6; }
  .foot { color: #a1a1a6; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
<div class="wall" aria-hidden="true" id="wall"></div>
<div class="veil" aria-hidden="true"></div>
<main class="center">
  <div class="card">
    <h1><img src="/img/careplix-logo.png" alt="CarePlix"><span>Studio</span></h1>
    <p class="lead">Films, decks and storyboards for CarePlix.</p>
    <div id="msg" hidden></div>
    <a class="signin" id="go" href="/auth/google" aria-label="Sign in with CarePlix">
      <span>Sign in with</span><img src="/img/careplix-logo.png" alt="">
    </a>
    <div class="who" id="who">For CarePlix accounts only.</div>
    <div class="foot">Style frames: Lemo-Opuscar by LemoLab, CC BY 4.0</div>
  </div>
</main>
<script>
  // drifting wall of style frames
  const slugs = ['watercolor', 'ukiyoe', 'iso-infographic', 'dark-keynote', 'brick-toy', 'impasto', 'satellite-briefing', 'swiss-motion', 'paper-popup', 'ink-wash', 'lidar-survey', 'cel-anime-80s', 'glass-product', 'risograph', 'stained-glass', 'hd-2d', 'blueprint', 'teardown', 'memphis-diorama', 'art-deco', 'tilt-shift', 'crayon-book', 'transit-map', 'data-physical', 'papercut-red'];
  const wall = document.getElementById('wall');
  for (let c = 0; c < 5; c++) {
    const col = document.createElement('div');
    col.className = 'col';
    const pick = slugs.filter((_, i) => i % 5 === c);
    for (const s of [...pick, ...pick, ...pick, ...pick]) {
      const img = document.createElement('img');
      img.src = '/gallery/frames/' + s + '.jpg';
      img.alt = '';
      img.loading = 'lazy';
      col.append(img);
    }
    wall.append(col);
  }
  const q = new URLSearchParams(location.search);
  if (q.get('next')) document.getElementById('go').href = '/auth/google?next=' + encodeURIComponent(q.get('next'));
  fetch('/auth/info').then(r => r.json()).then(i => {
    if (i.domains?.length) {
      const who = document.getElementById('who');
      who.textContent = '';
      who.append('Use your ', ...i.domains.flatMap((d, k) => [k ? ' or ' : '', Object.assign(document.createElement('b'), { textContent: '@' + d })]), ' work account. Google confirms it’s you.');
    }
  }).catch(() => {});
  const MSG = {
    domain: 'That Google account isn’t a CarePlix account. Choose your work account and try again.',
    'unverified-email': 'Google hasn’t verified that email address yet.',
    expired: 'The sign-in took too long. Please try again.',
    state: 'The sign-in link expired or was opened in another window. Please try again.',
    cancelled: 'Sign-in was cancelled.',
    google: 'Google couldn’t complete the sign-in. Please try again.',
  };
  const box = document.getElementById('msg');
  if (q.get('error')) { box.hidden = false; box.className = 'msg err'; box.textContent = MSG[q.get('error')] || MSG.google; }
  else if (q.get('signedout')) { box.hidden = false; box.className = 'msg ok'; box.textContent = 'You’re signed out.'; }
</script>
</body>
</html>
