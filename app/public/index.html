<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CarePlix Studio</title>
<link rel="icon" href="/img/careplix-mark.png">
<link rel="apple-touch-icon" href="/img/careplix-mark.png">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <!-- the CarePlix logo as supplied, on white (its navy letters need a light ground); the plus mark when the sidebar is narrow -->
      <span class="brand-badge"><img class="brand-logo" src="/img/careplix-logo-white.png" alt="CarePlix"><img class="brand-icon" src="/img/careplix-mark.png" alt="CarePlix"></span>
      <span class="brand-name">Studio</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#create" data-view="create"><span data-icon="sparkles"></span>Create</a>
      <a href="#productions" data-view="productions"><span data-icon="clapper"></span>Productions</a>
      <a href="#decks" data-view="decks"><span data-icon="slides"></span>Decks</a>
      <a href="#studio" data-view="studio"><span data-icon="clapper"></span>Studio<i class="live-dot" id="nav-live" hidden></i></a>
      <a href="#gallery" data-view="gallery"><span data-icon="grid"></span>Styles</a>
      <a href="#brands" data-view="brands"><span data-icon="palette"></span>Brands</a>
      <a href="#proof" data-view="proof"><span data-icon="shield"></span>Proof</a>
      <a href="#library" data-view="library"><span data-icon="film"></span>Library</a>
      <a href="#review" data-view="review"><span data-icon="seal"></span>Review<i class="nav-count" id="nav-review" hidden></i></a>
      <a href="#spend" data-view="spend"><span data-icon="coins"></span>Spend</a>
      <a href="#team" data-view="team"><span data-icon="users"></span>Team</a>
    </nav>
    <div class="side-foot" id="setup"></div>
  </aside>

  <main class="content">
    <section class="view" id="view-create" data-view="create"></section>
    <section class="view" id="view-studio" data-view="studio" hidden></section>
    <section class="view" id="view-gallery" data-view="gallery" hidden></section>
    <section class="view" id="view-library" data-view="library" hidden></section>
    <section class="view" id="view-brands" data-view="brands" hidden></section>
    <section class="view" id="view-proof" data-view="proof" hidden></section>
    <section class="view" id="view-decks" data-view="decks" hidden></section>
    <section class="view" id="view-productions" data-view="productions" hidden></section>
    <section class="view" id="view-review" data-view="review" hidden></section>
    <section class="view" id="view-spend" data-view="spend" hidden></section>
    <section class="view" id="view-team" data-view="team" hidden></section>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="sheets"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
